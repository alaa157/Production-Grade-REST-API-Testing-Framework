[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: quick health / critical-path checks
    positive: valid-input functional cases
    negative: invalid-input / error-handling cases
    boundary: edge / limit value cases
    contract: status code, headers and schema contract checks
    auth: authentication and authorization cases
    e2e: end-to-end workflow cases
